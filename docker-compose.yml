version: "3.9"

services:
  # ---------- Backend ----------
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - server/.env          # Railway/Render will inject secrets here
    environment:
      RAG_SERVICE_URL: http://rag:8000
    ports:
      - "5000:5000"
    depends_on:
      - rag
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---------- Retrieval-Augmented Generation ----------
  rag:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - server/.env
    environment:
      RAG_DATA_DIR: /app/data/documents
      RAG_VECTOR_DB_DIR: /app/vectorstore
    volumes:
      - rag_vectorstore:/app/vectorstore
    expose:
      - "8000"
    restart: unless-stopped

  # ---------- Frontend ----------
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rag_vectorstore:
