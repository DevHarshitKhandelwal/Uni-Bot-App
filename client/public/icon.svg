<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient using Palette #0D47A1 to #2196F3 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D47A1" />
      <stop offset="45%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>

    <!-- Frosted Highlight -->
    <linearGradient id="glassGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#90CAF9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#E3F2FD" stop-opacity="0.0" />
    </linearGradient>

    <!-- Inner Glow -->
    <linearGradient id="innerShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90CAF9" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#E3F2FD" stop-opacity="0.2" />
    </linearGradient>

    <filter id="macDropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0D47A1" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- macOS Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="url(#bgGrad)" filter="url(#macDropShadow)" />
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100" fill="none" stroke="url(#innerShine)" stroke-width="4" />
  <rect x="32" y="32" width="448" height="224" rx="100" ry="100" fill="url(#glassGloss)" />

  <!-- Academic Graduation Cap Emblem -->
  <g transform="translate(256, 240) scale(1.15)">
    <!-- Cap Top Diamond -->
    <polygon points="0,-70 120,-20 0,30 -120,-20" fill="#FFFFFF" opacity="0.98" />
    <polygon points="0,-70 120,-20 0, -10 -120,-20" fill="#E3F2FD" opacity="0.75" />

    <!-- Cap Skull Cap Underneath -->
    <path d="M -70,-5 C -70,55 70,55 70,-5" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <path d="M -54,12 C -54,48 54,48 54,12" fill="#90CAF9" opacity="0.45" />

    <!-- Tassel String and Bead -->
    <path d="M 0,-20 Q 80,0 85,55" fill="none" stroke="#90CAF9" stroke-width="6" stroke-linecap="round" />
    <circle cx="85" cy="58" r="7" fill="#E3F2FD" />
    <path d="M 85,64 L 85,82" stroke="#90CAF9" stroke-width="6" stroke-linecap="round" />

    <!-- Open Book Motif at Bottom -->
    <g transform="translate(0, 95)">
      <path d="M -75,-10 C -40,-24 -5,-15 0,-5 C 5,-15 40,-24 75,-10 L 75,18 C 40,5 5,14 0,22 C -5,14 -40,5 -75,18 Z" 
            fill="#E3F2FD" opacity="0.95" />
      <line x1="0" y1="-5" x2="0" y2="22" stroke="#0D47A1" stroke-width="3" opacity="0.4" />
    </g>
  </g>
</svg>
